 ${MEALS.map(([k,nm])=>{const L=items(today()).filter(i=>i.m==k);return `<section class="card"><div class="mh"><h3>${nm}</h3><span>${L.reduce((a,i)=>a+i.k,0)} ккал</span><button class="plus" aria-label="Добавить: ${nm}" onclick="openAdd('${k}')">+</button></div>${L.map(i=>`<div class="it"><div><b>${esc(i.n)}</b><small>${i.g} г · Б ${i.p} · Ж ${i.f} · У ${i.c}</small></div><span>${i.k}</span><button class="x" aria-label="Удалить" onclick="del('${i.id}')">×</button></div>`).join('')||'<p class="em">Нажмите «+» или сфотографируйте еду</p>'}</section>`}).join('')}

 return `<h1>Настройки</h1><section class="card"><div class="mh"><h3>Дневная норма</h3></div><p class="em">${n.k} ккал · белки ${n.p} г · жиры ${n.f} г · углеводы ${n.c} г${S.custom?' · изменено вручную':''}</p><div class="g2"><button class="sm" onclick="openMacros()">Настроить БЖУ</button><button class="sm" onclick="openProfile()">Данные и цель</button></div></section>
 <section class="card"><div class="mh"><h3>Уведомления о еде</h3><button class="sw ${any?'on':''}" role="switch" aria-checked="${any}" aria-label="Все уведомления о еде" onclick="setGroup(['b','l','d','s'])"></button></div>${REM.filter(r=>fk.includes(r[0])).map(row).join('')}</section>
 <section class="card"><div class="mh"><h3>Уведомления о воде</h3>${sw('w')}</div><div class="row"><span>С</span><input type="time" value="${W.from}" aria-label="Начало" onchange="wc('from',this.value)"></div><div class="row"><span>До</span><input type="time" value="${W.to}" aria-label="Конец" onchange="wc('to',this.value)"></div><div class="row"><span>Напоминать каждые</span><select style="width:auto;margin:0" aria-label="Интервал" onchange="wc('ev',+this.value)">${[1,2,3].map(h=>`<option value="${h}" ${W.ev==h?'selected':''}>${h} ч</option>`).join('')}</select></div></section>
 <section class="card"><div class="mh"><h3>Итоги дня</h3></div>${row(REM.find(r=>r[0]=='e'))}<p class="em">${permTxt()}</p></section>
 <section class="card"><h3>Данные</h3><p class="em">Дневник хранится в этом браузере на вашем устройстве.</p><button class="ghost" onclick="if(confirm('Удалить весь дневник и профиль?')){S={profile:null,log:{},water:{},weights:[],custom:null,foods:[],rem:{on:{},t:{},fired:{}},chat:[]};save();render()}">Удалить все данные</button></section>`}
function wc(k,v){S.rem.wc=S.rem.wc||{from:'09:00',to:'21:00',ev:2};S.rem.wc[k]=v;save()}
async function setGroup(ks){const on=!ks.some(k=>S.rem.on[k]);if(on&&'Notification' in window&&Notification.permission=='default'){try{await Notification.requestPermission()}catch(e){}}ks.forEach(k=>S.rem.on[k]=on);save();render()}
function openMacros(){const n=norm(S.profile),f=(i,l,v)=>`<label>${l}<input id="g_${i}" type="number" inputmode="numeric" value="${v}" oninput="mk()"></label>`;
 sheet(`<h2>Цели БЖУ</h2><p class="sub">Калории пересчитаются автоматически.</p><div class="g2" style="grid-template-columns:repeat(3,1fr)">${f('p','Белки, г',n.p)}${f('f','Жиры, г',n.f)}${f('c','Углеводы, г',n.c)}</div><p class="em" id="mk"></p><div class="warn">Если изменить баланс БЖУ, это может повлиять на то, как быстро вы достигнете цели.</div><button class="pri" onclick="saveMacros()">Сохранить</button>${S.custom?'<button class="ghost" onclick="S.custom=null;save();closeSheet();render()">Вернуть рекомендованные</button>':''}`);mk()}
function mk(){const g=i=>+$('#g_'+i).value||0,k=g('p')*4+g('f')*9+g('c')*4,r=norm(S.profile,1),d=R((k/r.k-1)*100);$('#mk').innerHTML=`Итого <b>${k} ккал</b> в день`+(Math.abs(d)>=1?` (${d>0?'+':''}${d}% к рекомендованным ${r.k})`:'')}
function saveMacros(){const g=i=>R(+$('#g_'+i).value);if([g('p'),g('f'),g('c')].some(x=>!(x>=0&&x<=800))||g('p')+g('f')+g('c')<50)return toast('Проверьте значения');S.custom={p:g('p'),f:g('f'),c:g('c')};save();closeSheet();render()}
async function setRem(k){const on=!S.rem.on[k];if(on&&'Notification' in window&&Notification.permission=='default'){try{await Notification.requestPermission()}catch(e){}}
 S.rem.on[k]=on;save();render();if(on&&!('Notification' in window&&Notification.permission=='granted'))toast('Разрешите уведомления для приложения в настройках iPhone')}
function permTxt(){const ios=/iPhone|iPad/.test(navigator.userAgent),sa=navigator.standalone||matchMedia('(display-mode:standalone)').matches;if(ios&&!sa)return 'На iPhone системные уведомления работают только после установки: «Поделиться» → «На экран Домой», затем откройте приложение с иконки.';return !('Notification' in window)?'Этот браузер не поддерживает системные уведомления — напоминание появится внутри приложения.':{granted:'Системные уведомления разрешены.',denied:'Системные уведомления запрещены в браузере — напоминание появится внутри приложения.',default:'Разрешение на уведомления ещё не выдано — браузер спросит при запуске теста.'}[Notification.permission]}
function b64u(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}
function schedSync(){clearTimeout(syncT);syncT=setTimeout(syncPush,800)}
async function syncPush(){if(!hasAPI()||!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!='granted')return;
 const cfg={on:S.rem.on,t:S.rem.t,wc:S.rem.wc||{from:'09:00',to:'21:00',ev:2}},any=Object.values(S.rem.on).some(Boolean),tz=-new Date().getTimezoneOffset(),str=JSON.stringify([cfg,any,tz]);if(str==lastSync)return;
 try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!any){if(sub)await callAPI({mode:'unsync',endpoint:sub.endpoint});PUSH=false;lastSync=str;return}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  await callAPI({mode:'sync',sub:sub.toJSON(),tz,cfg});PUSH=true;lastSync=str}catch(e){}}
async function notify(t,m,tag){try{if('Notification' in window&&Notification.permission=='granted'){const r=SW||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());if(r)r.showNotification(t,{body:m,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'kalorii'});else new Notification(t,{body:m})}}catch(e){}}
setInterval(()=>{if(PUSH)return;const hm=new Date().toTimeString().slice(0,5),d=today(),mn=x=>+x.slice(0,2)*60+ +x.slice(3,5);REM.forEach(([k,n,t,m])=>{if(S.rem.on[k]&&hm==(S.rem.t[k]||t)&&S.rem.fired[k]!=d){S.rem.fired[k]=d;save();notify(n,m,k)}});
 const w=S.rem.wc||{from:'09:00',to:'21:00',ev:2};if(S.rem.on.w&&hm>=w.from&&hm<=w.to&&(mn(hm)-mn(w.from))%(w.ev*60)==0&&S.rem.fired.w!=d+hm){S.rem.fired.w=d+hm;save();notify('Вода','Выпейте стакан воды','w')}},20000);
render();schedSync();
</script></body></html>
